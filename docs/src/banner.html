<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banner</title>
    <style>
      html,
      body {
        margin: 0;
      }

      /* Grayscale, like the extension's own panel. */
      .banner {
        box-sizing: border-box;
        width: 1280px;
        height: 400px;
        padding: 0 88px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #000;
        color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      h1 {
        margin: 0;
        font-size: 132px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: -0.03em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .feed {
        position: relative;
        display: inline-block;
      }

      .feed::after {
        content: '';
        position: absolute;
        inset: 50% -0.08em auto;
        height: 0.085em;
        translate: 0 -50%;
        background: #fff;
        box-shadow: 0 0 0 0.035em #000;
      }

      p {
        margin: 30px 0 0;
        font-size: 32px;
        color: #a0a0a0;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <h1>Kill the <span class="feed">Feed</span></h1>
      <p>Kill the feed, not your time.</p>
    </div>
  </body>
</html>
