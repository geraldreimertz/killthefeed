<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Banner</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      /* Laid out like the opening of dorweiler-reimertz.com: names on top, the claim at the bottom. */
      .banner {
        box-sizing: border-box;
        width: 1280px;
        height: 420px;
        padding: 40px 48px 44px;
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--paper);
        color: var(--ink);
      }

      .name {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.035em;
      }

      .claim {
        align-self: end;
        margin: 0;
        font: 300 104px/1 var(--serif);
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="name">Kill the Feed<i class="stop"></i></div>
      <p class="claim">Kill the feed, not your time.</p>
    </div>
  </body>
</html>
