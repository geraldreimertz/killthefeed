<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Before and after</title>
    <link rel="stylesheet" href="brand.css" />
    <style>
      /*
       * Drawn in one gray on a transparent ground, so the picture sits on a
       * light page and on a dark page alike.
       */
      .picture {
        --line: rgb(128 128 128 / 0.5);
        --fill: rgb(128 128 128 / 0.2);

        box-sizing: border-box;
        width: 1280px;
        padding: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        color: var(--muted);
      }

      h2 {
        margin: 0 0 16px;
        font-size: 22px;
        font-weight: 400;
      }

      .window {
        height: 440px;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        display: grid;
        grid-template-rows: 44px 1fr;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 18px;
        border-bottom: 1.5px solid var(--line);
      }

      .bar i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
      }

      .bar b {
        flex: 1;
        height: 18px;
        margin-left: 14px;
        border-radius: 9px;
        background: var(--fill);
      }

      .page {
        display: grid;
        grid-template-columns: 56px 1fr 120px;
        gap: 24px;
        padding: 24px 24px 0;
      }

      .rail,
      .side,
      .column {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .rail i {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--fill);
      }

      .side i {
        height: 74px;
        border-radius: 10px;
        background: var(--fill);
      }

      .composer {
        height: 36px;
        border: 1.5px solid var(--line);
        border-radius: 18px;
      }

      .post {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 10px 12px;
        padding: 14px;
        border-radius: 10px;
        background: var(--fill);
      }

      .post i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--line);
      }

      .post b {
        align-self: center;
        height: 10px;
        width: 50%;
        border-radius: 5px;
        background: var(--line);
      }

      .post u {
        grid-column: 1 / -1;
        height: 64px;
        border-radius: 6px;
        background: var(--fill);
      }

      .note {
        padding-top: 64px;
        text-align: center;
      }

      .note strong {
        display: block;
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      .note span {
        display: block;
        margin-top: 6px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="picture">
      <section>
        <h2>Before</h2>
        <div class="window">
          <div class="bar"><i></i><i></i><i></i><b></b></div>
          <div class="page">
            <div class="rail"><i></i><i></i><i></i><i></i></div>
            <div class="column">
              <div class="composer"></div>
              <div class="post"><i></i><b></b><u></u></div>
              <div class="post"><i></i><b></b><u></u></div>
              <div class="post"><i></i><b></b><u></u></div>
            </div>
            <div class="side"><i></i><i></i></div>
          </div>
        </div>
      </section>

      <section>
        <h2>After</h2>
        <div class="window">
          <div class="bar"><i></i><i></i><i></i><b></b></div>
          <div class="page">
            <div class="rail"><i></i><i></i><i></i><i></i></div>
            <div class="column">
              <div class="composer"></div>
              <div class="note">
                <strong>Feed killed.</strong>
                <span>Hidden by Kill the Feed. Go do what you came here for.</span>
              </div>
            </div>
            <div class="side"><i></i><i></i></div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
